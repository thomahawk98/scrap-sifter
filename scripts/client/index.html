<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Spaceships</title>
    <style>
        /* Fill the viewport with one shared WebGL and HUD presentation. */
        body {
            margin: 0;
            overflow: hidden;
            background: rgb(135, 206, 235);
        }

        /* Both render surfaces cover the viewport; the HUD sits above WebGL. */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #glcanvas {
            z-index: 0;
        }

        #hudcanvas {
            z-index: 1;
            pointer-events: none;
        }

        #menu-root {
            position: fixed;
            z-index: 2;
            inset: 0;
            color: #fff;
            font-family: Tahoma, sans-serif;
        }

        #menu-root.hidden { display: none; }
        .menu-screen { position: absolute; inset: 0; display: grid; place-items: center; }
        .menu-intro { background: #000; }
        .audio-prompt { border: 0; background: none; color: #fff; font: 18px Tahoma, sans-serif; cursor: pointer; }
        .menu-title {
            background: linear-gradient(180deg, rgba(3, 5, 18, .12), rgba(3, 5, 18, .72)),
                url('/assets/panorama/space-panorama.svg') center / cover no-repeat;
        }
        .title-content, .lobby-content { display: grid; justify-items: center; gap: 28px; text-align: center; }
        .title-content h1 { margin: 0; font-size: clamp(48px, 8vw, 100px); letter-spacing: .12em; text-shadow: 0 4px 24px #080b22; }
        .title-options { display: grid; gap: 14px; width: min(260px, 70vw); }
        .menu-screen button:not(.audio-prompt) {
            border: 1px solid rgba(191, 224, 255, .6); border-radius: 8px; padding: 12px 24px;
            color: #f4f8ff; background: rgba(10, 16, 38, .84); font: 18px Tahoma, sans-serif; cursor: pointer;
        }
        .menu-screen button:hover:not(:disabled) { background: rgba(67, 93, 145, .9); }
        .menu-screen button:disabled { opacity: .7; cursor: wait; }
        .credits { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .72); }
        .credits[hidden] { display: none; }
        .credits-card { min-width: 260px; padding: 28px; border: 1px solid #7890bb; border-radius: 10px; background: #10182c; text-align: center; }
        .menu-lobbies { overflow-y: auto; padding: 20px 0; background: linear-gradient(145deg, #080d1b, #172641); }
        .lobby-content { width: min(520px, 88vw); }
        .lobby-content h1 { margin: 0; font-size: clamp(32px, 5vw, 54px); }
        .menu-error { min-height: 1.2em; margin: 0; color: #ffb3aa; }
        .lobby-list { display: grid; gap: 10px; width: 100%; }
        .lobby-row { display: flex; gap: 8px; }
        .lobby-row > .lobby-entry { flex: 0 0 100%; width: 100%; }
        .lobby-actions { display: flex; flex: 0 0 auto; gap: 6px; }
        .menu-screen .lobby-entry { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; }
        .lobby-details { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .lobby-lock { font-size: 16px; }
        .lobby-symbol { font-size: 24px; font-weight: bold; }
        .lobby-settings-content { width: min(540px, 88vw); gap: 18px; }
        .lobby-settings { display: grid; gap: 12px; width: 100%; }
        .lobby-settings label, .password-dialog label { display: grid; gap: 6px; text-align: left; font-size: 14px; }
        .lobby-settings input, .lobby-settings select, .password-dialog input {
            box-sizing: border-box; width: 100%; border: 1px solid #7184a7; border-radius: 6px;
            padding: 10px; color: #fff; background: #0d1425; font: 16px Tahoma, sans-serif;
        }
        .lobby-settings [hidden] { display: none; }
        .form-actions { display: flex; justify-content: center; gap: 12px; }
        .password-dialog .credits-card { display: grid; gap: 16px; }
    </style>
</head>

<body>
    <canvas id="glcanvas"></canvas>
    <canvas id="hudcanvas"></canvas>
    <div id="menu-root"></div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./main.js"></script>
</body>

</html>
