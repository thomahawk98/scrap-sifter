<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Scrap Sifter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: rgb(135, 206, 235);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #glcanvas {
            z-index: 0;
        }

        #hudcanvas {
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="glcanvas"></canvas>
    <canvas id="hudcanvas"></canvas>
    <script type="module" src="./main.js"></script>
</body>

</html>
